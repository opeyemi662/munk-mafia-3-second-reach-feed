name: Update Munk Mafia Feed

on:
  workflow_dispatch:
  schedule:
    - cron: "0 */6 * * *"

permissions:
  contents: write

jobs:
  update-feed:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate feed
        env:
          SHOPIFY_SHOP_DOMAIN: "2ac08e-1f.myshopify.com"
          SHOPIFY_STOREFRONT_TOKEN: ${{ secrets.SHOPIFY_STOREFRONT_TOKEN }}
        run: |
          node <<'NODE'
          const fs = require("fs");

          const domain = process.env.SHOPIFY_SHOP_DOMAIN;
          const token = process.env.SHOPIFY_STOREFRONT_TOKEN;

          if (!token) {
            throw new Error("SHOPIFY_STOREFRONT_TOKEN secret is missing");
          }

          const query = `
            query Products($cursor: String) {
              products(first: 250, after: $cursor) {
                pageInfo {
                  hasNextPage
                  endCursor
                }
                nodes {
                  id
                  title
                  handle
                  onlineStoreUrl
                  featuredImage {
                    url
                  }
                  description
                  metafield(namespace: "custom", key: "3_second_reach") {
                    value
                  }
                }
              }
            }
          `;

          async function main() {
            let cursor = null;
            const items = [];

            do {
              const response = await fetch(
                "https://" + domain + "/api/2026-04/graphql.json",
                 { 
                 method: "POST",
                  headers: {
                    "Content-Type": "application/json",
                    "X-Shopify-Storefront-Access-Token": token
                  },
                  body: JSON.stringify({
                    query,
                    variables: { cursor }
                  })
                }
              );

              const data = await response.json();

              if (!response.ok || data.errors) {
                throw new Error(JSON.stringify(data, null, 2));
              }

              for (const product of data.data.products.nodes) {
                if (!product.metafield?.value) continue;

                items.push({
                  "$id": product.id,
                  "$title": product.title,
                 "$link": product.onlineStoreUrl || "https://" + domain + "/products/" + product.handle,
                  "$image_link": product.featuredImage?.url || "",
                  "$description": product.description || "",
                  "3_second_reach": product.metafield.value
                });
              }

              cursor = data.data.products.pageInfo.hasNextPage
                ? data.data.products.pageInfo.endCursor
                : null;

            } while (cursor);

            fs.writeFileSync(
              "feed.json",
              JSON.stringify(items, null, 2)
            );

           console.log("Generated feed with " + items.length + " products.");
          }

          main().catch(error => {
            console.error(error);
            process.exit(1);
          });
          NODE

      - name: Commit feed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add feed.json
          git diff --cached --quiet || git commit -m "Update Munk Mafia product feed"
          git push
